[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["venv", ".venv"]

[tool.ruff.lint]
# E/W: estilo PEP 8 · F: errores (imports y variables sin usar, nombres indefinidos) · B: errores probables
select = ["E", "W", "F", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: pruebas que requieren MySQL y MongoDB reales"]

[tool.coverage.run]
omit = ["tests/*", "venv/*"]
